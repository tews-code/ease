[package]
name = "ease"
version = "0.1.0"
edition = "2024"
description = "EASE - OS for RP2350"

[lib]
name = "ease"
path = "src/lib.rs"

[[bin]]
name = "ease"
path = "src/main.rs"

[features]
default = ["test-all"]
qemu = []  # For QEMU-specific code
test-fs = []
test-virtio = []
test-collections = []
test-alloc = []
test-shell = []
test-all = ["test-fs", "test-virtio", "test-collections", "test-alloc", "test-shell"]

[profile.test]
opt-level = 1

[package.metadata.docs.rs]
targets = ["riscv32imac-unknown-none-elf"]
