[package]
name = "ease"
version = "0.1.0"
edition = "2024"
description = "EASE - OS for RP2350"

[lib]
name = "ease"
path = "src/lib.rs"

[[bin]]
name = "ease"
path = "src/main.rs"

[features]
default = ["test-all"]
qemu = []  # For QEMU-specific code
profile = []
trace = []
# Interrupts-off tracer: per-hart share of time with MIE clear and the
# longest section per opening site (see kernel/irqsoff.rs). QEMU-only.
irqsoff = []
# Benchmark suite. Sole gate for all benchmark `#[test_case]`s — NOT
# ANDed with any area feature — so `cargo test --features bench` compiles
# and runs only the benchmarks, no functional tests. Not part of test-all.
bench = []
paint-stack = []
uart-throttle = []
test-alloc = []
test-boot-data = []
test-clint = []
test-collections = []
test-fs = []
fat16 = []
fat32 = []
test-io = []
test-pmp = []
test-sched = []
test-shell = []
test-stack-guard = []
test-timer = []
test-virtio = []
# NB: test-fat16 / test-fat32 are intentionally NOT in test-all — they select
# mutually exclusive on-disk layouts (one disk per run), so ci.sh picks exactly
# one via --fat32 (default: test-fat16). Bundling both here would compile and
# run both disk-specific test sets against a single image.
test-all = ["test-alloc", "test-boot-data", "test-clint", "test-collections", "test-fs", "test-io", "test-pmp", "test-sched", "test-shell", "test-stack-guard", "test-timer", "test-virtio"]

[dependencies]
ease-macros = { path = "../ease-macros" }
ease-abi = { path = "../ease-abi" }

[package.metadata.docs.rs]
targets = ["riscv32imac-unknown-none-elf"]
